<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/icone-teste.png" type="image/x-icon">
    <title>Shelfy</title>

    <!-- Importando Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" type="text/css" href="/static/style/login.css" />
    
</head>
<body>
    <div class="container d-flex  flex-column justify-content-center align-items-center content">

        {{#erro_campos}}
            <div class="alert alert-danger mt-2">
                <strong>Erro! </strong>Preencha todos os campos.
            </div>
        {{/erro_campos}}

        {{#erro_login}}
            <div class="alert alert-danger mt-2">
                <strong>Credenciais incorretas! </strong>Verifique os campos.
            </div>
        {{/erro_login}}

        <div class="login-box">

            <div class="row d-flex" style="text-align: center;">
                <a href="/">
                    <img src="/static/images/icon-vertical.png" alt="Ícone de Shelfy" class="logo">
                </a>
            </div>

            <div class="login-form">
                <h5>Login em Shelfy</h5>

                <form action="/user/autenticar" method="post">
                    <div class="row">
                        <label for="email">E-mail:</label>
                        <input type="text" id="email" name="email" value="{{dados_usuario.nome}}">
                    </div>

                    <div class="row">
                        <label for="email">Senha:</label>
                        <input type="password" id="senha" name="senha" value="{{dados_usuario.senha}}">
                    </div>

                    <div class="row d-flex justify-content-center">
                        <button class="submit-btn">Entrar</button>
                    </div>
                </form>
            </div>
        </div>

        <p class="link">Não possui conta? <a href="/user/Cadastro">Cadastre-se</a></p>
    </div>
</body>
</html>
