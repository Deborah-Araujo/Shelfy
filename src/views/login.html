<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="icon" href="{{ url_for('static', filename='icons/daily-cosmos-logo2.png') }}" type="image/x-icon"> -->
    <title>Shelfy</title>

    <!-- Importando Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" type="text/css" href="/style/login.css" />
    
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center content">
        <div class="login-box">

            <div class="row d-flex justify-content-center">
                <img src="/images/icon-vertical.png" alt="Ícone de Shelfy" class="logo">
            </div>

            <div class="login-form">
                <h5>Login em Shelfy</h5>

                <form action="">
                    <div class="row">
                        <label for="email">E-mail:</label>
                        <input type="text" id="email" name="email">
                    </div>

                    <div class="row">
                        <label for="email">Senha:</label>
                        <input type="text" id="senha" name="senha">
                    </div>

                    <div class="row d-flex justify-content-center">
                        <button class="submit-btn">Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
