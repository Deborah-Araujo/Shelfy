!<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="static/images/icone-teste.png" type="image/x-icon">
    <title>Shelfy</title>

    <!-- Importando Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="/static/style/estantes.css">
    
</head>
<body>

    <main>
        <div class="container d-flex justify-content-center">
            {{#erro_campos}}
                <div class="alert alert-danger mt-2">
                    <strong>Erro! </strong>Preencha todos os campos.
                </div>
            {{/erro_campos}}

            <button class="novo-btn" onclick="openPopup()">Novo <img src="/static/icons/icon-mais.png" alt="ícone de mais" class="icon"></button>

                <div class="container d-flex justify-content-center">
                    {{#estantes}}

                    <button type="button" class="external-btn btn" data-bs-toggle="dropdown" style="display: flex; margin-right: 2rem;">
                            <div class="estante">
                                {{nome}}
                            </div>
                        </button>
                        <ul class="dropdown-menu" style="margin-top: 0.8rem; margin-left: -2.2rem; height: 7.3rem; text-align: right;">
                            <li class="dropdown-item1"> <a href="/estantes/{{id}}"> Visualizar</a></li>
                            <li class="dropdown-item2"><a href="">Editar</a></li>
                            <li class="dropdown-item3"><a href="">Adicionar livro</a></li>
                            <li class="dropdown-item4"><a href="">Remover</a></li>
                        </ul>

                    {{/estantes}}
                </div>
        </div>
    </main>

    <div class="popup" id="popup">
        <div class="popup-content">

            <h6>Adicionar nova estante </h6>

            <form action="/estantes/adicionar" method="POST">
                <div class="novo-form">
                    <div class="row">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" value="{{dados_estante.nome}}">
                    </div>

                    <div class="row ajustify-content-between">
                        <div class="col-9">
                            <label for="tema">Tema:</label>
                            <input type="text" id="tema" name="tema" value="{{dados_estante.tema}}">
                        </div>

                        <div class="col-3">
                            <label for="cor">Cor:</label>
                            <select name="cor" id="cor">
                                    <option value="#F06365">Vermelho</option>
                                    <option value="#4B3F6E">Azul</option>
                                    <option value="#90A8DF">Azul claro</option>
                                    <option value="#86BD96">Verde</option>
                                    <option value="#DCD7D5">Cinza</option>
                                    <option value="#9C8CB9">Roxo</option>
                                    <option value="#F4B166">Laranja</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <label for="descricao">Descrição:</label>
                        <textarea type="text" id="descricao" name="descricao" value="{{dados_estante.descricao}}"></textarea>
                    </div>

                    <div class="row d-flex justify-content-center">
                        <button class="submit-btn">Criar</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</body>
</html>

<script>
    function openPopup() {
        document.getElementById('popup').style.display = 'flex';
    }

    const popup = document.getElementById('popup');
    const content = document.querySelector('.popup-content');

    popup.addEventListener('click', function(event) {
        if (!content.contains(event.target)) {
            popup.style.display = 'none';
        }
    });
</script>
