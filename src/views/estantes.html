!<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="static/images/icone-teste.png" type="image/x-icon">
    <title>Shelfy</title>

    <!-- Importando Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    
        <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons (pelo ícone bi-list) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">


    <link rel="stylesheet" href="/static/style/estantes.css">
    
</head>
<body>
    <!-- Futura pesquisa na sidebar -->
    <!-- <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
    </form> -->

    <div id="sidebar">
        <button id="toggle-expand" aria-label="Expandir ou recolher sidebar">➡️</button>
        <img src="/static/images/icon-vertical.png" alt="">

        <ul>
            <li><a href="#"><span class="icon">🏠</span> <span class="text">Home</span></a></li>
            <li><a href="#"><span class="icon">📚</span> <span class="text">Minhas Estantes</span></a></li>
            <li><a href="#"><span class="icon">⚙️</span> <span class="text">Configurações</span></a></li>
        </ul>
    </div>


    <main>
        <div class="container d-flex justify-content-center">
            {{#erro_campos}}
                <div class="alert alert-danger mt-2">
                    <strong>Erro! </strong>Preencha todos os campos.
                </div>
            {{/erro_campos}}

            <button class="novo-btn" onclick="openPopup()">Novo <img src="/static/icons/icon-mais.png" alt="ícone de mais" class="icon"></button>
                <div class="container d-flex justify-content-center">
                    {{#estantes}}

                        <div class="estante">
                            {{nome}}
                        </div>

                    {{/estantes}}
                </div>
        </div>
    </main>

    <div class="popup" id="popup">
        <div class="popup-content">

            <h6>Adicionar nova estante </h6>

            <form action="/estantes/adicionar" method="POST">
                <div class="novo-form">
                    <div class="row">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" value="{{dados_estante.nome}}">
                    </div>

                    <div class="row ajustify-content-between">
                        <div class="col-9">
                            <label for="tema">Tema:</label>
                            <input type="text" id="tema" name="tema" value="{{dados_estante.tema}}">
                        </div>

                        <div class="col-3">
                            <label for="cor">Cor:</label>
                            <select name="cor" id="cor">
                                    <option value="#F06365">Vermelho</option>
                                    <option value="#4B3F6E">Azul</option>
                                    <option value="#90A8DF">Azul claro</option>
                                    <option value="#86BD96">Verde</option>
                                    <option value="#DCD7D5">Cinza</option>
                                    <option value="#9C8CB9">Roxo</option>
                                    <option value="#F4B166">Laranja</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <label for="descricao">Descrição:</label>
                        <textarea type="text" id="descricao" name="descricao" value="{{dados_estante.descricao}}"></textarea>
                    </div>

                    <div class="row d-flex justify-content-center">
                        <button class="submit-btn">Criar</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</body>
</html>

<script>
    function openPopup() {
        document.getElementById('popup').style.display = 'flex';
    }

    const popup = document.getElementById('popup');
    const content = document.querySelector('.popup-content');

    popup.addEventListener('click', function(event) {
        if (!content.contains(event.target)) {
            popup.style.display = 'none';
        }
    });
</script>

<script>
    const sidebar = document.getElementById('sidebar');
    const main = document.querySelector('main');
    const toggleButton = document.getElementById('toggle-expand');

    toggleButton.addEventListener('click', () => {
    sidebar.classList.toggle('expanded');
    main.classList.toggle('expanded');

    toggleButton.textContent = sidebar.classList.contains('expanded') ? '⬅️' : '➡️';
    });

</script>
