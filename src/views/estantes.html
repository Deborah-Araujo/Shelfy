<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/icone-teste.png" type="image/x-icon">
    <title>Shelfy</title>

    <!-- Importando Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Importando arquivos CSS -->
    <link rel="stylesheet" href="/static/style/estantes.css">
    <link rel="stylesheet" href="/static/style/side-bar.css">
</head>
<body>
    <main>
        <nav id="sidebar">
            <button id="toggle-expand" aria-label="Expandir ou recolher sidebar"><img class="img-mobile" src="/static/images/tres-tracinhos.png" alt=""></button>
            <img class="img-central" src="/static/images/icon-vertical2.png" alt="">

            <ul class="side-lista">
                <li><a href="/estantes/todas"><span class="icon"><img src="/static/images/estantinha.png" alt=""></span><span class="text">Home</span></a></li>
                <li><a href="/estantes/todas"><span class="icon"><img src="/static/images/livrin.png" alt=""></span> <span class="text">Minhas Estantes</span></a></li>
                <li><a href="https://github.com/Deborah-Araujo/Shelfy.git"><span class="icon"><img src="/static/images/config2.png" alt=""></span> <span class="text">Configurações</span></a></li>
            </ul>

            <div class="dropup sidebar-footer">
                <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="/static/images/gatin.png" alt="Usuário" class="user-img">
                    <span class="user-name">{{nomeUsuario}}</span>
                </button>

                <div class="dropdown-menu user-menu" aria-labelledby="userDropdown">
                    <div class="dropdown-item-text text-center">{{emailUsuario}}</div>
                    <a class="dropdown-item text-center" href="/user/logout">Logout</a>
                </div>
            </div>
        </nav>

        <div class="row">
            <div class="col-8">
                <!-- TESTE - barra de pesquisa -->
                <form method="GET" action="/estantes/todas" class="mb-4 d-flex justify-content-center">
                    <input type="text" name="busca" class="search-bar form-control me-2" placeholder="Pesquisar estante" value="{{busca}}">
                    <button type="submit" class="btn search-btn"><img class="search-img" src="/static/images/lupa.png" alt=""></button>
                </form>

                <!-- TESTE - barra de pesquisa (mensagem de ERRO) -->
                {{^estantes}}
                    <div class="alert alert-warning text-center">Nenhuma estante encontrada.</div>
                {{/estantes}}
            </div>
            <div class="col-4">
                <button class="novo-btn" onclick="openPopup()">Novo<img src="/static/icons/icon-mais.png" alt="ícone de mais" class="icon-novo"></button>

                {{#erro_campos}}
                    <div class="alert alert-danger mt-2">
                        <strong>Erro! </strong>Preencha todos os campos.
                    </div>
                {{/erro_campos}}
            </div>
        </div>

        <div class="container d-flex flex-wrap">
            <div class="row">
            {{#estantes}}

                <!-- TESTE - DROPDOWN MENU -->
                <div class="col context-menu-wrapper position-relative">
                    <a href="/estantes/{{id_estante}}" class="estante-card" oncontextmenu="abrirMenuContexto(event, this)"
                        data-id-estante="{{id_estante}}"
                        data-nome-estante="{{nome_estante}}"
                        data-tema-estante="{{tema_estante}}"
                        data-cor-estante="{{cor_estante}}"
                        data-descricao-estante="{{descricao_estante}}">

                        <img src="/static/images/estante-cheia.png" alt="Estante" class="estante-img {{cor_estante}}">
                        <h5 class="estante-nome">{{nome_estante}}</h5>
                        <p class="estante-descricao">{{descricao_estante}}</p>
                    </a>

                    <ul class="dropdown-menu estante-menu">
                        <li><button class="dropdown-item" onclick="openPopupEditar(this)">Editar</button></li>
                        <li><button class="dropdown-item" onclick="mostrarCaixa(this)">Deletar</button></li>
                    </ul>
                </div>

            {{/estantes}}
            </div>
        </div>

    </main>

    <div class="popup" id="popup">
        <div class="popup-content">

            <h6>Adicionar nova estante </h6>

            <form action="/estantes/adicionar" method="POST">
                <div class="novo-form">
                    <div class="row">
                        <label for="nome_estante">Nome:</label>
                        <input type="text" id="nome_estante" name="nome_estante" value="{{dados_estante.nome_estante}}">
                    </div>

                    <div class="row ajustify-content-between">
                        <div class="col-9">
                            <label for="tema_estante">Tema:</label>
                            <input type="text" id="tema_estante" name="tema_estante" value="{{dados_estante.tema_estante}}">
                        </div>

                        <div class="col-3">
                            <label for="cor_estante">Cor:</label>
                            <select name="cor_estante" id="cor_estante">
                                    <option value="vermelho" class="vermelho">Vermelho</option>
                                    <option value="azul" class="azul">Azul</option>
                                    <option value="azul-claro" class="azul-claro">Azul claro</option>
                                    <option value="verde" class="verde">Verde</option>
                                    <option value="cinza" class="cinza">Cinza</option>
                                    <option value="roxo" class="roxa">Roxo</option>
                                    <option value="laranja" class="laranja">Laranja</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <label for="descricao_estante">Descrição:</label>
                        <textarea type="text" id="descricao_estante" name="descricao_estante" value="{{dados_estante.descricao_estante}}"></textarea>
                    </div>

                    <div class="row d-flex justify-content-center">
                        <button class="submit-btn">Criar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="popup" id="popup-editar">
        <div class="popup-editar-content">

            <h6>Editar estante</h6>

            <form method="POST" class="form-editar">
                <div class="novo-form">
                    <div class="row">
                        <label for="nome_estante_editar">Nome:</label>
                        <input type="text" id="nome_estante_editar" name="nome_estante">
                    </div>

                    <div class="row ajustify-content-between">
                        <div class="col-9">
                            <label for="tema_estante_editar">Tema:</label>
                            <input type="text" id="tema_estante_editar" name="tema_estante">
                        </div>

                        <div class="col-3">
                            <label for="cor_estante_editar">Cor:</label>
                            <select id="cor_estante_editar" name="cor_estante">
                                    <option value="vermelho" class="vermelho">Vermelho</option>
                                    <option value="azul">Azul</option>
                                    <option value="azul-claro">Azul claro</option>
                                    <option value="verde">Verde</option>
                                    <option value="cinza">Cinza</option>
                                    <option value="roxo">Roxo</option>
                                    <option value="laranja">Laranja</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <label for="descricao_estante_editar">Descrição:</label>
                        <textarea type="text" id="descricao_estante_editar" name="descricao_estante"></textarea>
                    </div>

                    <div class="row d-flex justify-content-center">
                        <button class="submit-btn">Salvar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

<!-- TESTE - DROPDOWN MENU -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const botoes = document.querySelectorAll('.estante-card');

        botoes.forEach((btn) => {
            btn.addEventListener('contextmenu', (event) => {
                event.preventDefault();

                const menu = btn.parentElement.querySelector('.dropdown-menu');
                menu.style.display = 'block';
                menu.classList.add('show');

                // passa os dados para os botões do menu
                menu.querySelectorAll('.dropdown-item').forEach(item => {
                    item.setAttribute('data-id-estante', btn.dataset.idEstante);
                    item.setAttribute('data-nome-estante', btn.dataset.nomeEstante);
                    item.setAttribute('data-tema-estante', btn.dataset.temaEstante);
                    item.setAttribute('data-cor-estante', btn.dataset.corEstante);
                    item.setAttribute('data-descricao-estante', btn.dataset.descricaoEstante);
                });
            });

            document.addEventListener('click', (e) => {
                const menu = btn.parentElement.querySelector('.dropdown-menu');
                if (!menu.contains(e.target)) {
                    menu.classList.remove('show');
                    menu.style.display = 'none';
                }
            });
        });
    });

</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
  const sidebar = document.getElementById('sidebar');
  const dropupToggle = document.querySelector('.sidebar-footer .dropdown-toggle');
  const dropupMenu = document.querySelector('.sidebar-footer .dropdown-menu');

  // Impede o dropup de abrir se a sidebar não estiver expandida
  dropupToggle.addEventListener('click', function (event) {
    if (!sidebar.classList.contains('expanded')) {
      event.preventDefault(); // impede de abrir
      event.stopPropagation();
    }
  });

  // Garante que o menu nunca esteja visível por padrão
  dropupMenu.classList.remove('show');
});
</script>

<script>
    // Referente ao de adicionar nova estante
    function openPopup() {
        document.getElementById('popup').style.display = 'flex';
    }

    const popup = document.getElementById('popup');
    const content = document.querySelector('.popup-content');

    popup.addEventListener('click', function(event) {
        if (!content.contains(event.target)) {
            popup.style.display = 'none';
        }
    });
</script>

<script>
    // Referente a sidebar
    const sidebar = document.getElementById('sidebar');
    const main = document.querySelector('main');
    const toggleButton = document.getElementById('toggle-expand');

    toggleButton.addEventListener('click', () => {
    sidebar.classList.toggle('expanded');
    main.classList.toggle('expanded');

    // toggleButton.textContent = sidebar.classList.contains('expanded') ? '⬅️' : '➡️';
    });

</script>

<script>
    const popupEditar = document.getElementById('popup-editar');
    const contentEditar = document.querySelector('.popup-editar-content');

    popupEditar.addEventListener('click', function(event) {
        if (!contentEditar.contains(event.target)) {
            popupEditar.style.display = 'none';
        }
    });

    function openPopupEditar(elemento) {
        id = elemento.getAttribute('data-id-estante')
        console.log("id da estante: ", id)
        nome = elemento.getAttribute('data-nome-estante');

        tema = elemento.getAttribute('data-tema-estante');
        cor = elemento.getAttribute('data-cor-estante');
        descricao = elemento.getAttribute('data-descricao-estante');

        const form_editar = popupEditar.querySelector('.form-editar');
        form_editar.action = `/estantes/editar/${id}`;

        document.getElementById('nome_estante_editar').value = nome;
        document.getElementById('tema_estante_editar').value = tema;
        document.getElementById('cor_estante_editar').value = cor;
        document.getElementById('descricao_estante_editar').value = descricao;

        document.getElementById('popup-editar').style.display = 'flex';
    }
</script>

<script>
    function mostrarCaixa(elemento) {
    const resposta = confirm("Deseja realmente deletar a estante?");
    if (resposta) {
        const id = elemento.getAttribute('data-id-estante');

        fetch(`/estantes/deletar/${id}`, {
            method: 'POST'
            }).then(res => {
            if (res.redirected) {
                window.location.href = res.url;
            } else {
                alert('Estante deletada!');
                location.reload();
            }
        });
    }
    }
</script>

</body>
</html>
