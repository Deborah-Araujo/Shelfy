<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="static/images/icone-teste.png" type="image/x-icon">
    <title>Shelfy</title>

    <!-- Importando Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="/static/style/estante_unica.css">
    
</head>
    <main>
        {{#estante}}
            <div class="container estante">

                <button type="button" class="external-btn btn" data-bs-toggle="dropdown" style="display: flex; margin-right: 2rem;">
                    {{nome_estante}}

                    {{#estante.livros}}
                        <div class="livro">
                            <p>{{titulo_livro}}</p>
                            <p>{{autor_livro}}</p>
                        </div>
                    {{/estante.livros}}
                </button>

                <ul class="dropdown-menu" style="margin-top: 0.8rem; margin-left: 2rem; height: 7.3rem; text-align: right;">

                    <li class="dropdown-item2">Editar</li>
                    
                    <li class="dropdown-item3" 
                        data-id-estante="{{id_estante}}" 
                        data-nome-estante="{{nome_estante}}" 
                        onclick="openPopup(this)">
                        Adicionar livro
                    </li>
                    <li class="dropdown-item4">Remover</li>
                </ul>

            </div>
        {{/estante}}    
    </main>

    <div class="popup" id="popup">
        <div class="popup-content">

            <h6>Adicionar novo livro em <span class="nome-estante"></span></h6>

            <!-- 'Action' será preenchido pelo javaScript -->
            <form method="POST">
                <div class="novo-form">
                    <div class="row">
                        <label for="titulo_livro">Título:</label>
                        <input type="text" id="titulo_livro" name="titulo_livro">
                    </div>

                    <div class="row ajustify-content-between">
                        <div class="col-4">
                            <label for="status_livro">Status de leitura:</label>
                            <select name="status_livro" id="status_livro">
                                    <option value="Terminado">Terminado</option>
                                    <option value="Lendo">Lendo</option>
                                    <option value="Não iniciado">Não iniciado</option>
                            </select>
                        </div>

                        <div class="col-8">
                            <label for="autor_livro">Autor:</label>
                            <input type="text" id="autor_livro" name="autor_livro">
                        </div>
                    </div>

                    <div class="row">
                        <label for="descricao_livro">Descrição:</label>
                        <textarea type="text" id="descricao_livro" name="descricao_livro"></textarea>
                    </div>

                    <div class="row d-flex justify-content-center">
                        <button class="submit-btn">Criar</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</body>
</html>

<script>
function openPopup(element) {
    const idEstante = element.getAttribute('data-id-estante');
    const nomeEstante = element.getAttribute('data-nome-estante');

    // Exibe o popup
    const popup = document.getElementById('popup');
    popup.style.display = 'flex';

    // Atualiza o action do form
    const form = popup.querySelector('form');
    form.action = `/livro/adicionar/${idEstante}`;

    // Atualizar o título no popup com o nome da estante
    const titulo = popup.querySelector('.nome-estante');
    if (titulo) {
        titulo.textContent = nomeEstante;
    }
}

// Fecha o popup ao clicar fora do conteúdo
const popup = document.getElementById('popup');
const content = document.querySelector('.popup-content');

popup.addEventListener('click', function(event) {
    if (!content.contains(event.target)) {
        popup.style.display = 'none';
    }
});
</script>
